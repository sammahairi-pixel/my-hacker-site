<!DOCTYPE html>
<html>
<head>
  <title>My Hacker Site</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      padding: 40px;
      line-height: 1.6;
      margin: 0;
      overflow-x: hidden;
    }
    h1 {
      text-shadow: 0 0 10px #00ff41;
      border-bottom: 1px solid #00ff41;
      padding-bottom: 10px;
    }
    .content {
      position: relative;
      z-index: 1;
    }
    .cursor {
      display: inline-block;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      opacity: 0.4;
    }
    .terminal-box {
      border: 1px solid #00ff41;
      box-shadow: 0 0 10px #00ff41, inset 0 0 10px rgba(0, 255, 65, 0.2);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
      background: rgba(0, 20, 0, 0.3);
    }
    .last-login {
      color: #00cc33;
      font-size: 0.9em;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    #boot-sequence {
      white-space: pre-wrap;
    }
    #main-content {
      display: none;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9em;
    }
    #command-output {
      white-space: pre-wrap;
      min-height: 60px;
      margin-bottom: 10px;
    }
    .command-line {
      display: flex;
      align-items: center;
    }
    .prompt-symbol {
      margin-right: 8px;
    }
    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 1em;
      flex: 1;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="content">
    <div class="last-login" id="last-login"></div>

    <div class="terminal-box">
      <div id="boot-sequence"></div>
    </div>

    <div id="main-content">
      <h1>Hello, world!</h1>
      <p>This is ??? website, and I made it.<span class="cursor">_</span></p>

      <div class="terminal-box">
        <div class="stat-row"><span>Visitor count:</span><span id="visitor-count">Loading...</span></div>
        <div class="stat-row"><span>Time until mainframe lockdown:</span><span id="countdown">Loading...</span></div>
      </div>

      <div class="terminal-box">
        <div id="command-output">Type "help" for a list of commands.</div>
        <div class="command-line">
          <span class="prompt-symbol">&gt;</span>
          <input type="text" id="command-input" autocomplete="off" autofocus>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Matrix background
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = "アイウエオカキクケコサシスセソタチツテト0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(13, 13, 13, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff41";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Last login message
    const now = new Date();
    document.getElementById('last-login').textContent =
      "Last login: " + now.toDateString() + " " + now.toLocaleTimeString() + " on ttys001";

    // Boot sequence
    const bootLines = [
      "INITIALIZING SYSTEM...",
      "LOADING MODULES... [OK]",
      "BYPASSING FIREWALL... [OK]",
      "DECRYPTING DATA... [OK]",
      "ACCESS GRANTED"
    ];

    const bootElement = document.getElementById('boot-sequence');
    let lineIndex = 0;

    function typeLine() {
      if (lineIndex < bootLines.length) {
        bootElement.textContent += bootLines[lineIndex] + "\n";
        lineIndex++;
        setTimeout(typeLine, 500);
      } else {
        setTimeout(() => {
          document.getElementById('main-content').style.display = 'block';
          startCountdown();
        }, 500);
      }
    }
    typeLine();

    // Visitor counter (fake, random-ish but consistent per browser using localStorage-free approach)
    const visitorNumber = Math.floor(Math.random() * 9000) + 1000;
    document.getElementById('visitor-count').textContent = "#" + String(visitorNumber).padStart(6, '0');

    // Countdown timer
    function startCountdown() {
      let totalSeconds = 5 * 60 * 60 + 59 * 60 + 23; // starts around 5:59:23
      const countdownEl = document.getElementById('countdown');

      setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
        } else {
          totalSeconds = 5 * 60 * 60 + 59 * 60 + 23; // reset when it hits zero
        }
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        countdownEl.textContent =
          String(h).padStart(2, '0') + ":" +
          String(m).padStart(2, '0') + ":" +
          String(s).padStart(2, '0');
      }, 1000);
    }

    // Fake command line input
    const commandInput = document.getElementById('command-input');
    const commandOutput = document.getElementById('command-output');

    const responses = {
      help: "Available commands: help, about, hack, whoami, clear",
      about: "This site was built by a curious human learning to code.",
      hack: "Initiating hack sequence... just kidding. Nice try.",
      whoami: "You are an anonymous visitor to this terminal.",
      clear: ""
    };

    commandInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const cmd = commandInput.value.trim().toLowerCase();
        if (cmd === 'clear') {
          commandOutput.textContent = '';
        } else if (responses[cmd]) {
          commandOutput.textContent += "\n> " + cmd + "\n" + responses[cmd];
        } else if (cmd !== '') {
          commandOutput.textContent += "\n> " + cmd + "\nCommand not found. Type 'help' for options.";
        }
        commandInput.value = '';
        commandOutput.scrollTop = commandOutput.scrollHeight;
      }
    });
  </script>

</body>
</html>
